<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dino Dash Modern Multiplayer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Press+Start+2P&display=swap');
        
        body {
            background-color: #e0f2fe; /* Sky 100 */
            touch-action: none;
            user-select: none;
            overflow: hidden;
            font-family: 'Nunito', sans-serif;
        }

        .pixel-font { font-family: 'Press Start 2P', monospace; }
        
        /* Hiệu ứng trôi nổi */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            /* Khử mờ trên màn hình độ phân giải cao */
            image-rendering: -webkit-optimize-contrast; 
        }

        /* Glass HUD */
        .glass-hud {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="text-slate-800 h-screen w-screen flex flex-col font-sans">

    <!-- ================= MÀN HÌNH MENU CHÍNH ================= -->
    <div id="screen-menu" class="absolute inset-0 z-50 flex flex-col items-center justify-center p-4 bg-gradient-to-br from-blue-100 to-indigo-100 transition-opacity duration-300">
        <div class="bg-white/80 backdrop-blur-xl border border-white p-8 rounded-3xl shadow-2xl w-full max-w-md text-center transform transition-all">
            <div class="w-24 h-24 mx-auto mb-6 flex items-center justify-center animate-float bg-blue-500 rounded-3xl shadow-lg shadow-blue-500/30 transform rotate-3">
                <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-14 h-14">
                    <path d="M12 22s-8-4.5-8-11.8A8 8 0 0 1 12 2a8 8 0 0 1 8 8.2c0 7.3-8 11.8-8 11.8z"></path>
                    <circle cx="12" cy="10" r="3"></circle>
                </svg>
            </div>
            <h1 class="text-3xl font-black text-slate-800 mb-2 leading-tight tracking-tight">DINO DASH</h1>
            <p class="text-slate-500 mb-8 font-bold text-sm uppercase tracking-wider">Web game Khủng long lỏ nhất 2026</p>

            <div class="space-y-4">
                <input type="text" id="player-name" placeholder="Nhập tên của bạn..." maxlength="12" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-4 text-center font-bold text-lg outline-none focus:ring-2 focus:ring-blue-500 transition-all shadow-inner">

                <button onclick="createRoom()" class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white font-black rounded-2xl shadow-lg shadow-blue-600/30 transition-all active:scale-95 flex items-center justify-center gap-2" id="btn-create">
                    <i class="fa-solid fa-plus"></i> TẠO PHÒNG ĐUA
                </button>
                
                <div class="flex gap-2">
                    <input type="text" id="join-code" placeholder="Mã phòng..." class="flex-1 bg-slate-50 border border-slate-200 rounded-2xl px-4 text-center font-mono uppercase text-lg outline-none focus:ring-2 focus:ring-blue-500 shadow-inner">
                    <button onclick="joinRoom()" class="w-14 h-14 bg-slate-800 hover:bg-slate-900 text-white rounded-2xl shadow-md transition-all active:scale-95 flex items-center justify-center" id="btn-join">
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </div>
        </div>
        <div id="auth-status" class="mt-6 text-sm font-bold text-slate-600 bg-white/50 px-5 py-2.5 rounded-full backdrop-blur-md shadow-sm">
            <i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Đang khởi tạo...
        </div>
    </div>

    <!-- ================= MÀN HÌNH LOBBY CHỜ ================= -->
    <div id="screen-lobby" class="absolute inset-0 z-40 flex flex-col items-center justify-center p-4 bg-slate-900 hidden transition-opacity duration-300">
        <div class="bg-slate-800 border border-slate-700 p-8 rounded-3xl shadow-2xl w-full max-w-md text-center text-white relative">
            <button onclick="leaveRoom()" class="absolute top-4 left-4 text-slate-400 hover:text-white"><i class="fa-solid fa-arrow-left text-xl"></i></button>
            
            <h2 class="text-xl font-black mb-6 text-blue-400 tracking-wider">PHÒNG CHỜ</h2>
            
            <div class="bg-slate-900/80 p-4 rounded-2xl mb-8 border border-slate-700 shadow-inner">
                <p class="text-xs text-slate-400 uppercase tracking-widest mb-2 font-bold">Mã chia sẻ</p>
                <div class="flex items-center justify-center gap-4">
                    <span id="lobby-code" class="text-4xl font-mono font-black text-white tracking-widest">---</span>
                    <button onclick="copyCode()" class="w-12 h-12 bg-blue-600/20 text-blue-400 rounded-xl hover:bg-blue-600 hover:text-white transition shadow-sm"><i class="fa-regular fa-copy text-xl"></i></button>
                </div>
            </div>

            <div class="flex justify-between items-center bg-slate-700/50 p-4 rounded-2xl mb-4 border border-slate-600">
                <div class="flex flex-col items-start">
                    <span class="text-xs text-slate-400 font-bold uppercase">Chủ phòng</span>
                    <span id="lobby-host-name" class="font-black text-lg">---</span>
                </div>
                <i class="fa-solid fa-crown text-amber-400 text-2xl drop-shadow-md"></i>
            </div>

            <div class="flex justify-between items-center bg-slate-700/50 p-4 rounded-2xl mb-8 border border-slate-600">
                <div class="flex flex-col items-start">
                    <span class="text-xs text-slate-400 font-bold uppercase">Đối thủ</span>
                    <span id="lobby-peer-name" class="font-black text-lg text-slate-300">Đang đợi...</span>
                </div>
                <div id="lobby-peer-status">
                    <i class="fa-solid fa-spinner fa-spin text-slate-400 text-2xl"></i>
                </div>
            </div>

            <button onclick="startGameHost()" id="btn-start" disabled class="w-full py-4 bg-blue-600 hover:bg-blue-500 disabled:bg-slate-700 disabled:text-slate-500 text-white font-black rounded-2xl shadow-lg transition-all active:scale-95 text-lg tracking-wider">
                BẮT ĐẦU ĐUA
            </button>
            <p id="msg-waiting-host" class="text-sm font-bold text-slate-400 mt-4 hidden animate-pulse">Chờ chủ phòng bắt đầu...</p>
        </div>
    </div>

    <!-- ================= MÀN HÌNH GAME ================= -->
    <div id="screen-game" class="absolute inset-0 z-30 flex flex-col hidden bg-gradient-to-b from-sky-100 to-sky-50">
        
        <!-- Top HUD (Glassmorphism) -->
        <div class="absolute top-4 left-4 right-4 z-20 flex justify-between items-start pointer-events-none">
            <!-- P1 (Me) -->
            <div class="glass-hud px-4 py-2 rounded-2xl flex flex-col items-start">
                <span id="ui-my-name" class="text-xs font-black text-blue-600 uppercase tracking-wider mb-0.5">Tôi</span>
                <span id="ui-my-score" class="pixel-font text-lg text-slate-800 drop-shadow-sm">00000</span>
            </div>
            
            <!-- VS Status -->
            <div id="ui-status-msg" class="glass-hud px-4 py-2 rounded-full font-black text-xs text-amber-600 tracking-widest uppercase animate-pulse shadow-sm">
                CHỜ ĐỒNG BỘ
            </div>

            <!-- P2 (Opponent) -->
            <div class="glass-hud px-4 py-2 rounded-2xl flex flex-col items-end">
                <span id="ui-opp-name" class="text-xs font-black text-red-500 uppercase tracking-wider mb-0.5">Đối thủ</span>
                <div class="flex items-center gap-2">
                    <span id="ui-opp-status" class="text-[10px] px-2 py-0.5 bg-green-500 text-white rounded font-black hidden shadow-sm">RUN</span>
                    <span id="ui-opp-score" class="pixel-font text-lg text-slate-500">00000</span>
                </div>
            </div>
        </div>

        <!-- Canvas Area -->
        <div class="flex-1 w-full relative flex items-center justify-center cursor-pointer overflow-hidden" id="canvas-container">
            <canvas id="gameCanvas"></canvas>
            
            <!-- Countdown Overlay -->
            <div id="countdown-overlay" class="absolute inset-0 flex items-center justify-center hidden pointer-events-none z-50 bg-white/30 backdrop-blur-sm">
                <span id="countdown-text" class="text-8xl font-black text-blue-600 drop-shadow-xl transform transition-transform scale-150">3</span>
            </div>
        </div>
        
        <!-- Controls Helper (Mobile) -->
        <div class="h-20 w-full flex items-center justify-center bg-white/50 backdrop-blur-md text-slate-500 text-sm font-bold pb-2 z-20 shadow-[0_-10px_20px_rgba(0,0,0,0.02)]">
            <i class="fa-solid fa-hand-pointer mr-2 animate-bounce"></i> Chạm màn hình hoặc phím Space để Nhảy
        </div>
    </div>

    <!-- MODAL THÔNG BÁO / KẾT QUẢ -->
    <div id="modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300 p-4">
        <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm text-center transform scale-95 transition-transform duration-300 border-4 border-white" id="modal-content">
            <div class="w-20 h-20 bg-amber-100 rounded-full mx-auto flex items-center justify-center mb-4 shadow-inner">
                <i class="fa-solid fa-trophy text-4xl text-amber-500 drop-shadow-sm"></i>
            </div>
            <h2 id="modal-title" class="font-black text-2xl text-slate-800 mb-6 leading-tight tracking-wider">KẾT QUẢ</h2>
            
            <div class="bg-slate-50 p-4 rounded-2xl mb-6 text-left space-y-3 shadow-inner border border-slate-100">
                <div class="flex justify-between items-center border-b border-slate-200 pb-3">
                    <span id="res-name-1" class="font-bold text-slate-600 text-lg">Bạn</span>
                    <span id="res-score-1" class="pixel-font text-base text-blue-600">0000</span>
                </div>
                <div class="flex justify-between items-center pt-1">
                    <span id="res-name-2" class="font-bold text-slate-600 text-lg">Đối thủ</span>
                    <span id="res-score-2" class="pixel-font text-base text-red-500">0000</span>
                </div>
            </div>
            
            <p id="modal-desc" class="text-slate-800 mb-8 font-black text-xl tracking-wide uppercase">Bạn đã thắng!</p>
            
            <div class="flex gap-3 justify-center">
                <button onclick="leaveRoom()" class="px-5 py-4 bg-slate-100 hover:bg-slate-200 text-slate-600 font-black rounded-2xl transition">Thoát</button>
                <button id="btn-modal-ok" onclick="handleModalOk()" class="flex-1 py-4 bg-blue-600 hover:bg-blue-700 text-white font-black rounded-2xl shadow-lg transition">Chơi Lại</button>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="fixed top-10 right-4 bg-slate-800/90 backdrop-blur text-white px-5 py-3 rounded-2xl shadow-xl z-[150] transform transition-all duration-300 translate-y-[-20px] opacity-0 pointer-events-none text-sm font-bold flex items-center gap-3">
        <i class="fa-solid fa-bell text-blue-400"></i>
        <span id="toast-text">Thông báo</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        let app, auth, db, user;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'my-dino-game';

        // --- FIREBASE INIT ---
        const initFirebase = () => {
            try {
                let firebaseConfig = null;
                if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                    firebaseConfig = JSON.parse(__firebase_config);
                } else {
                    firebaseConfig = {
                        apiKey: "AIzaSyBwSNpLu5liMKbkYtaA_YMRQxEup_BrLeQ",
                        authDomain: "caro-online-3056e.firebaseapp.com",
                        projectId: "caro-online-3056e",
                        storageBucket: "caro-online-3056e.firebasestorage.app",
                        messagingSenderId: "490204158312",
                        appId: "1:490204158312:web:1cb84bb4184a2d22d81edd"
                    };
                }

                if (!firebaseConfig || !firebaseConfig.apiKey) throw new Error("No Config");

                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                
                const handleAuth = async () => {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                };
                handleAuth();

                onAuthStateChanged(auth, (u) => {
                    user = u;
                    document.getElementById('auth-status').innerHTML = u ? `<i class="fa-solid fa-check text-green-500 mr-1"></i> Máy chủ sẵn sàng` : `<i class="fa-solid fa-xmark text-red-500 mr-1"></i> Lỗi đăng nhập`;
                });
            } catch (e) {
                document.getElementById('auth-status').innerHTML = `<i class="fa-solid fa-triangle-exclamation text-amber-500 mr-1"></i> Chỉ hỗ trợ Online. Vui lòng cấu hình Firebase.`;
                db = null; 
            }
        };
        initFirebase();

        // --- GAME ENGINE & MODERN PHYSICS ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const container = document.getElementById('canvas-container');

        let ENGINE = {
            isRunning: false,
            lastTime: 0,
            accumulator: 0,
            timeStep: 1000 / 60,
            
            seed: 12345,
            
            baseWidth: 1000,
            baseHeight: 400,
            scale: 1,

            dino: { x: 80, y: 0, w: 44, h: 48, vy: 0, isJumping: false, dead: false },
            groundY: 300,
            gravity: 0.65,
            jumpForce: -13,
            speed: 7,
            baseSpeed: 7,
            
            obstacles: [],
            clouds: [],
            particles: [],
            nextSpawnDist: 0,
            distanceTravelled: 0,
            
            score: 0,
            frames: 0,
            lastSyncScore: 0
        };

        function seededRandom() {
            var t = ENGINE.seed += 0x6D2B79F5;
            t = Math.imul(t ^ t >>> 15, t | 1);
            t ^= t + Math.imul(t ^ t >>> 7, t | 61);
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        }

        function resizeCanvas() {
            const w = container.clientWidth;
            const h = container.clientHeight;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = w * dpr;
            canvas.height = h * dpr;
            ctx.scale(dpr, dpr);
            canvas.style.width = `${w}px`;
            canvas.style.height = `${h}px`;

            ENGINE.scale = Math.min(w / ENGINE.baseWidth, h / ENGINE.baseHeight);
            ENGINE.groundY = h * 0.75; 
            
            if(!ENGINE.dino.isJumping) ENGINE.dino.y = ENGINE.groundY - ENGINE.dino.h;
        }
        window.addEventListener('resize', resizeCanvas);

        function drawRoundedRect(x, y, w, h, r, fill, stroke) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
            if (fill) { ctx.fillStyle = fill; ctx.fill(); }
            if (stroke) { ctx.strokeStyle = stroke; ctx.stroke(); }
        }

        function drawModernDino() {
            const d = ENGINE.dino;
            const color = state.isHost ? '#3b82f6' : '#ef4444'; 
            const bellyColor = state.isHost ? '#bfdbfe' : '#fecaca';

            ctx.save();
            ctx.translate(d.x, d.y);

            if (d.dead) {
                ctx.translate(d.w/2, d.h/2);
                ctx.rotate(Math.PI / 8); 
                ctx.translate(-d.w/2, -d.h/2);
            }

            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            drawRoundedRect(2, 4, d.w, d.h, 12, true);

            drawRoundedRect(0, 0, d.w, d.h, 14, color);

            ctx.fillStyle = bellyColor;
            ctx.beginPath();
            ctx.arc(d.w/2 - 2, d.h - 10, 15, Math.PI, 0, false);
            ctx.fill();

            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(10, d.h - 15);
            ctx.lineTo(-10, d.h - 5);
            ctx.lineTo(10, d.h);
            ctx.fill();

            drawRoundedRect(d.w - 18, 5, 22, 18, 8, color);

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(d.w - 6, 12, 6, 0, Math.PI*2);
            ctx.fill();

            if (!d.dead) {
                ctx.fillStyle = '#0f172a';
                ctx.beginPath();
                ctx.arc(d.w - 4, 12, 2.5, 0, Math.PI*2);
                ctx.fill();
            } else {
                ctx.strokeStyle = '#0f172a';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(d.w - 9, 9); ctx.lineTo(d.w - 3, 15);
                ctx.moveTo(d.w - 3, 9); ctx.lineTo(d.w - 9, 15);
                ctx.stroke();
            }

            ctx.fillStyle = '#1e293b';
            let l1 = 0, l2 = 0;
            if (!d.isJumping && !d.dead) {
                const cycle = Math.floor(ENGINE.frames / 6) % 2;
                l1 = cycle === 0 ? -6 : 0;
                l2 = cycle === 1 ? -6 : 0;
            } else if (d.isJumping) {
                l1 = -6; l2 = -6;
            }
            
            drawRoundedRect(12, d.h - 6 + l1, 8, 12, 4, color); 
            drawRoundedRect(d.w - 18, d.h - 6 + l2, 8, 12, 4, color); 
            
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            drawRoundedRect(d.w - 18, d.h - 6 + l2, 8, 12, 4, true); 

            ctx.restore();
        }

        function drawModernCactus(obs) {
            drawRoundedRect(obs.x, obs.y, obs.w, obs.h, 8, '#22c55e');
            drawRoundedRect(obs.x + 4, obs.y + 2, obs.w - 8, obs.h - 2, 4, '#4ade80');
            
            if (obs.type === 'complex') {
                drawRoundedRect(obs.x - 14, obs.y + 15, 16, 10, 4, '#22c55e');
                drawRoundedRect(obs.x - 14, obs.y + 5, 10, 20, 4, '#22c55e');
                drawRoundedRect(obs.x + obs.w - 2, obs.y + 25, 16, 10, 4, '#22c55e');
                drawRoundedRect(obs.x + obs.w + 4, obs.y + 15, 10, 20, 4, '#22c55e');
            }
            
            ctx.fillStyle = '#064e3b';
            ctx.beginPath();
            ctx.arc(obs.x + obs.w/2 - 4, obs.y + 15, 2, 0, Math.PI*2);
            ctx.arc(obs.x + obs.w/2 + 4, obs.y + 15, 2, 0, Math.PI*2);
            ctx.fill();
        }

        function spawnParticles(x, y) {
            for(let i=0; i<3; i++) {
                ENGINE.particles.push({
                    x: x + Math.random()*20,
                    y: y,
                    vx: -Math.random()*2 - ENGINE.speed/2,
                    vy: -Math.random()*2,
                    life: 1,
                    size: Math.random()*4 + 2
                });
            }
        }

        function resetEngine() {
            ENGINE.dino.y = ENGINE.groundY - ENGINE.dino.h;
            ENGINE.dino.vy = 0;
            ENGINE.dino.isJumping = false;
            ENGINE.dino.dead = false;
            ENGINE.obstacles = [];
            ENGINE.particles = [];
            
            ENGINE.clouds = [];
            for(let i=0; i<5; i++) {
                ENGINE.clouds.push({
                    x: Math.random() * 1000,
                    y: Math.random() * (ENGINE.groundY - 150) + 20,
                    s: Math.random() * 0.5 + 0.2,
                    speed: Math.random() * 0.5 + 0.2
                });
            }

            ENGINE.distanceTravelled = 0;
            ENGINE.nextSpawnDist = 500; 
            ENGINE.score = 0;
            ENGINE.speed = ENGINE.baseSpeed;
            ENGINE.frames = 0;
            ENGINE.lastSyncScore = 0;
            resizeCanvas();
        }

        function spawnObstacle() {
            const types = [
                { w: 26, h: 45, type: 'simple' }, 
                { w: 40, h: 45, type: 'simple' }, 
                { w: 32, h: 60, type: 'complex' }  
            ];
            const type = types[Math.floor(seededRandom() * types.length)];
            
            ENGINE.obstacles.push({
                x: container.clientWidth + 50,
                y: ENGINE.groundY - type.h,
                w: type.w,
                h: type.h,
                type: type.type
            });

            const minGap = 250 + (ENGINE.speed * 12);
            const maxGap = minGap + 350;
            ENGINE.nextSpawnDist = ENGINE.distanceTravelled + minGap + (seededRandom() * (maxGap - minGap));
        }

        function updatePhysics() {
            if (ENGINE.dino.dead) return;

            ENGINE.speed = ENGINE.baseSpeed + (ENGINE.score / 600);
            if(ENGINE.speed > 16) ENGINE.speed = 16;

            ENGINE.distanceTravelled += ENGINE.speed;
            ENGINE.frames++;
            
            if(!ENGINE.dino.isJumping && ENGINE.frames % 5 === 0) {
                spawnParticles(ENGINE.dino.x, ENGINE.groundY);
            }

            if (ENGINE.frames % 5 === 0) {
                ENGINE.score++;
                document.getElementById('ui-my-score').innerText = String(ENGINE.score).padStart(5, '0');
                
                if (ENGINE.score - ENGINE.lastSyncScore >= 50) {
                    syncStatusToServer(false);
                    ENGINE.lastSyncScore = ENGINE.score;
                }
            }

            ENGINE.dino.vy += ENGINE.gravity;
            ENGINE.dino.y += ENGINE.dino.vy;

            if (ENGINE.dino.y > ENGINE.groundY - ENGINE.dino.h) {
                if (ENGINE.dino.isJumping) {
                    spawnParticles(ENGINE.dino.x + 10, ENGINE.groundY); 
                }
                ENGINE.dino.y = ENGINE.groundY - ENGINE.dino.h;
                ENGINE.dino.vy = 0;
                ENGINE.dino.isJumping = false;
            }

            if (ENGINE.distanceTravelled > ENGINE.nextSpawnDist) spawnObstacle();

            for (let i = 0; i < ENGINE.obstacles.length; i++) {
                let obs = ENGINE.obstacles[i];
                obs.x -= ENGINE.speed;

                let hX = ENGINE.dino.x + 8;
                let hY = ENGINE.dino.y + 8;
                let hW = ENGINE.dino.w - 16;
                let hH = ENGINE.dino.h - 12;

                let oX = obs.x + 4;
                let oY = obs.y + 4;
                let oW = obs.w - 8;
                let oH = obs.h - 4;

                if (hX < oX + oW && hX + hW > oX && hY < oY + oH && hY + hH > oY) {
                    ENGINE.dino.dead = true;
                    handleDeath();
                }
            }

            if (ENGINE.obstacles.length > 0 && ENGINE.obstacles[0].x < -100) {
                ENGINE.obstacles.shift();
            }

            ENGINE.clouds.forEach(c => {
                c.x -= c.speed;
                if(c.x < -100) { c.x = container.clientWidth + 100; c.y = Math.random() * (ENGINE.groundY - 150) + 20; }
            });

            for(let i=ENGINE.particles.length-1; i>=0; i--) {
                let p = ENGINE.particles[i];
                p.x += p.vx; p.y += p.vy;
                p.life -= 0.05;
                if(p.life <= 0) ENGINE.particles.splice(i, 1);
            }
        }

        function draw() {
            const w = container.clientWidth;
            const h = container.clientHeight;

            ctx.clearRect(0, 0, w, h);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ENGINE.clouds.forEach(c => {
                ctx.save();
                ctx.translate(c.x, c.y);
                ctx.scale(c.s, c.s);
                ctx.beginPath();
                ctx.arc(0, 0, 20, 0, Math.PI*2);
                ctx.arc(15, -10, 25, 0, Math.PI*2);
                ctx.arc(30, 0, 20, 0, Math.PI*2);
                ctx.fill();
                ctx.restore();
            });

            ctx.fillStyle = '#cbd5e1'; 
            ctx.fillRect(0, ENGINE.groundY, w, 4);
            
            let grad = ctx.createLinearGradient(0, ENGINE.groundY, 0, h);
            grad.addColorStop(0, 'rgba(203, 213, 225, 0.4)');
            grad.addColorStop(1, 'rgba(203, 213, 225, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, ENGINE.groundY + 4, w, h - ENGINE.groundY);

            ctx.fillStyle = '#94a3b8';
            const offset = -(ENGINE.distanceTravelled % 200);
            for(let i=0; i<w/200 + 2; i++) {
                drawRoundedRect(offset + i*200 + 40, ENGINE.groundY + 12, 8, 4, 2, true);
                drawRoundedRect(offset + i*200 + 120, ENGINE.groundY + 25, 12, 4, 2, true);
                drawRoundedRect(offset + i*200 + 180, ENGINE.groundY + 8, 6, 4, 2, true);
            }

            for (let obs of ENGINE.obstacles) {
                drawModernCactus(obs);
            }

            ctx.fillStyle = 'rgba(148, 163, 184, 0.6)';
            for(let p of ENGINE.particles) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2);
                ctx.fill();
            }

            drawModernDino();
        }

        function gameLoop(timestamp) {
            if (!ENGINE.isRunning) return;

            if (!ENGINE.lastTime) ENGINE.lastTime = timestamp;
            let dt = timestamp - ENGINE.lastTime;
            ENGINE.lastTime = timestamp;
            
            if (dt > 100) dt = 100;

            ENGINE.accumulator += dt;
            while (ENGINE.accumulator >= ENGINE.timeStep) {
                updatePhysics();
                ENGINE.accumulator -= ENGINE.timeStep;
            }

            draw();

            if (ENGINE.dino.dead && state.oppDead) {
                ENGINE.isRunning = false;
                state.status = 'finished';
                showResults();
            } else {
                requestAnimationFrame(gameLoop);
            }
        }

        function jump() {
            if (state.status !== 'playing' || !ENGINE.isRunning || ENGINE.dino.dead) return;
            if (!ENGINE.dino.isJumping) {
                ENGINE.dino.vy = ENGINE.jumpForce;
                ENGINE.dino.isJumping = true;
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                jump();
            }
        });
        container.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); }, {passive: false});
        container.addEventListener('mousedown', jump);


        // --- MULTIPLAYER STATE ---
        let state = {
            roomId: null,
            isHost: true,
            status: 'menu',
            myName: 'Player',
            oppName: 'Waiting...',
            myScore: 0,
            oppScore: 0,
            oppDead: false,
            unsubscribe: null
        };

        // --- UI HELPERS ---
        const ui = {
            menu: document.getElementById('screen-menu'),
            lobby: document.getElementById('screen-lobby'),
            game: document.getElementById('screen-game'),
            toast: document.getElementById('toast'),
            toastTxt: document.getElementById('toast-text'),
            
            showScreen: (id) => {
                ui.menu.classList.add('hidden');
                ui.lobby.classList.add('hidden');
                ui.game.classList.add('hidden');
                document.getElementById(id).classList.remove('hidden');
                if(id === 'screen-game') resizeCanvas();
            },
            toast: (msg) => {
                ui.toastTxt.innerText = msg;
                ui.toast.classList.remove('translate-y-[-20px]', 'opacity-0');
                setTimeout(() => ui.toast.classList.add('translate-y-[-20px]', 'opacity-0'), 2500);
            }
        };

        window.copyCode = () => {
            navigator.clipboard.writeText(state.roomId);
            ui.toast("Đã copy mã phòng!");
        };

        function getMyName() {
            return document.getElementById('player-name').value.trim() || "Dino R";
        }

        // --- MULTIPLAYER LOGIC ---
        const genCode = () => Math.random().toString(36).substring(2, 7).toUpperCase();

        window.createRoom = async () => {
            if (!db || !user) return ui.toast("Lỗi kết nối máy chủ.");
            const btn = document.getElementById('btn-create');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>'; btn.disabled = true;

            state.myName = getMyName();
            state.roomId = genCode();
            state.isHost = true;
            
            try {
                const ref = doc(db, 'artifacts', appId, 'public', 'data', 'dino_rooms', state.roomId);
                await setDoc(ref, {
                    hostId: user.uid, hostName: state.myName, hostScore: 0, hostDead: false,
                    peerId: null, peerName: null, peerScore: 0, peerDead: false,
                    status: 'waiting', seed: null, startTime: null
                });

                document.getElementById('lobby-code').innerText = state.roomId;
                document.getElementById('lobby-host-name').innerText = state.myName;
                ui.showScreen('screen-lobby');
                listenRoom(ref);
            } catch (e) {
                console.error("Lỗi tạo phòng:", e);
                ui.toast("Lỗi tạo phòng: " + (e.message.includes("permission") ? "Thiếu quyền Firestore" : e.message));
            } finally {
                btn.innerHTML = '<i class="fa-solid fa-plus"></i> TẠO PHÒNG ĐUA'; btn.disabled = false;
            }
        };

        window.joinRoom = async () => {
            if (!db || !user) return ui.toast("Lỗi kết nối máy chủ.");
            const code = document.getElementById('join-code').value.toUpperCase().trim();
            if (!code) return ui.toast("Nhập mã phòng");
            
            const btn = document.getElementById('btn-join');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>'; btn.disabled = true;

            state.myName = getMyName();

            try {
                const ref = doc(db, 'artifacts', appId, 'public', 'data', 'dino_rooms', code);
                const snap = await getDoc(ref);
                if (snap.exists()) {
                    const data = snap.data();
                    if (data.status !== 'waiting' && data.peerId !== user.uid) {
                        ui.toast("Phòng đã đầy hoặc đang chơi"); return;
                    }
                    
                    if (data.hostId !== user.uid) {
                        await updateDoc(ref, { peerId: user.uid, peerName: state.myName });
                        state.isHost = false;
                        state.oppName = data.hostName;
                    } else {
                        state.isHost = true;
                    }

                    state.roomId = code;
                    document.getElementById('lobby-code').innerText = code;
                    document.getElementById('lobby-host-name').innerText = data.hostName || "Host";
                    ui.showScreen('screen-lobby');
                    listenRoom(ref);
                } else {
                    ui.toast("Mã phòng sai!");
                }
            } catch(e) {
                console.error("Lỗi tham gia:", e);
                ui.toast("Lỗi tham gia: " + (e.message.includes("permission") ? "Thiếu quyền Firestore" : e.message));
            } finally {
                btn.innerHTML = '<i class="fa-solid fa-arrow-right"></i>'; btn.disabled = false;
            }
        };

        window.leaveRoom = () => {
            if (state.unsubscribe) state.unsubscribe();
            if (!state.isHost && state.roomId && db && user) {
                updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'dino_rooms', state.roomId), { peerId: null, peerName: null }).catch(()=>{});
            }
            state.roomId = null;
            ENGINE.isRunning = false;
            state.status = 'menu';
            
            // Đóng modal kết quả nếu đang mở
            document.getElementById('modal').classList.add('opacity-0');
            setTimeout(() => document.getElementById('modal').classList.add('hidden'), 300);

            ui.showScreen('screen-menu');
        };

        window.startGameHost = async () => {
            if(!state.isHost || !db) return;
            const ref = doc(db, 'artifacts', appId, 'public', 'data', 'dino_rooms', state.roomId);
            await updateDoc(ref, {
                status: 'playing',
                seed: Math.floor(Math.random() * 999999),
                startTime: Date.now() + 3000, 
                hostScore: 0, hostDead: false,
                peerScore: 0, peerDead: false
            });
        };

        function listenRoom(ref) {
            if (state.unsubscribe) state.unsubscribe();
            
            state.unsubscribe = onSnapshot(ref, (snap) => {
                if (!snap.exists()) return window.leaveRoom();
                const data = snap.data();
                
                if (data.status === 'waiting') {
                    if (data.peerName) {
                        document.getElementById('lobby-peer-name').innerText = data.peerName;
                        document.getElementById('lobby-peer-name').classList.remove('text-slate-300');
                        document.getElementById('lobby-peer-name').classList.add('text-green-400');
                        document.getElementById('lobby-peer-status').innerHTML = '<i class="fa-solid fa-check text-green-500 text-2xl drop-shadow-md"></i>';
                        if (state.isHost) document.getElementById('btn-start').disabled = false;
                    } else {
                        document.getElementById('lobby-peer-name').innerText = "Đang đợi...";
                        document.getElementById('lobby-peer-status').innerHTML = '<i class="fa-solid fa-spinner fa-spin text-slate-400 text-2xl"></i>';
                        if (state.isHost) document.getElementById('btn-start').disabled = true;
                    }
                    if (!state.isHost) {
                        document.getElementById('btn-start').classList.add('hidden');
                        document.getElementById('msg-waiting-host').classList.remove('hidden');
                    }

                    // Xử lý chuyển từ Game/Kết quả về Phòng chờ
                    if (state.status === 'playing' || state.status === 'finished') {
                        state.status = 'waiting';
                        document.getElementById('modal').classList.add('opacity-0');
                        setTimeout(() => document.getElementById('modal').classList.add('hidden'), 300);
                        ui.showScreen('screen-lobby');
                    }
                }

                if (data.status === 'playing' && state.status !== 'playing') {
                    state.status = 'playing';
                    ENGINE.seed = data.seed;
                    state.oppDead = false;
                    
                    document.getElementById('ui-my-name').innerText = state.myName;
                    document.getElementById('ui-opp-name').innerText = state.isHost ? data.peerName : data.hostName;
                    
                    document.getElementById('ui-status-msg').innerText = "SẴN SÀNG";
                    document.getElementById('ui-opp-status').classList.remove('hidden', 'bg-red-500');
                    document.getElementById('ui-opp-status').classList.add('bg-green-500');
                    document.getElementById('ui-opp-status').innerText = "RUN";
                    
                    ui.showScreen('screen-game');
                    resetEngine();
                    startCountdown();
                }

                if (state.status === 'playing') {
                    if (state.isHost) {
                        state.oppScore = data.peerScore;
                        state.oppDead = data.peerDead;
                    } else {
                        state.oppScore = data.hostScore;
                        state.oppDead = data.hostDead;
                    }
                    
                    document.getElementById('ui-opp-score').innerText = String(state.oppScore).padStart(5, '0');
                    
                    if (state.oppDead) {
                        document.getElementById('ui-opp-status').classList.remove('bg-green-500');
                        document.getElementById('ui-opp-status').classList.add('bg-red-500');
                        document.getElementById('ui-opp-status').innerText = "DEAD";
                        
                        if(!ENGINE.dino.dead) document.getElementById('ui-status-msg').innerText = "ĐỐI THỦ ĐÃ GỤC!";
                    }
                }
            });
        }

        // --- GAME FLOW ---
        function startCountdown() {
            const overlay = document.getElementById('countdown-overlay');
            const txt = document.getElementById('countdown-text');
            overlay.classList.remove('hidden');
            
            let count = 3;
            txt.innerText = count;
            
            draw();

            const interval = setInterval(() => {
                count--;
                if (count > 0) {
                    txt.innerText = count;
                    txt.classList.remove('scale-150');
                    void txt.offsetWidth; 
                    txt.classList.add('scale-150');
                } else if (count === 0) {
                    txt.innerText = "GO!";
                } else {
                    clearInterval(interval);
                    overlay.classList.add('hidden');
                    document.getElementById('ui-status-msg').innerText = "ĐANG CHẠY...";
                    ENGINE.isRunning = true;
                    ENGINE.lastTime = 0;
                    requestAnimationFrame(gameLoop);
                }
            }, 1000);
        }

        async function syncStatusToServer(isDead) {
            if(!db || !state.roomId) return;
            const ref = doc(db, 'artifacts', appId, 'public', 'data', 'dino_rooms', state.roomId);
            if (state.isHost) {
                await updateDoc(ref, { hostScore: ENGINE.score, hostDead: isDead }).catch(()=>{});
            } else {
                await updateDoc(ref, { peerScore: ENGINE.score, peerDead: isDead }).catch(()=>{});
            }
        }

        function handleDeath() {
            document.getElementById('ui-status-msg').innerText = "BẠN ĐÃ CHẾT";
            document.getElementById('ui-status-msg').classList.replace('text-amber-600', 'text-red-600');
            draw(); 
            syncStatusToServer(true);

            if (state.oppDead) {
                setTimeout(showResults, 1000);
            }
        }

        function showResults() {
            const modal = document.getElementById('modal');
            
            document.getElementById('res-name-1').innerText = state.myName;
            document.getElementById('res-score-1').innerText = ENGINE.score;
            document.getElementById('res-name-2').innerText = document.getElementById('ui-opp-name').innerText;
            document.getElementById('res-score-2').innerText = state.oppScore;

            const desc = document.getElementById('modal-desc');
            const btn = document.getElementById('btn-modal-ok');
            
            if (ENGINE.score > state.oppScore) {
                desc.innerText = "🎉 BẠN ĐÃ CHIẾN THẮNG!";
                desc.className = "text-blue-600 mb-8 font-black text-xl tracking-wide uppercase";
            } else if (ENGINE.score < state.oppScore) {
                desc.innerText = "💔 BẠN ĐÃ THUA!";
                desc.className = "text-red-600 mb-8 font-black text-xl tracking-wide uppercase";
            } else {
                desc.innerText = "🤝 HÒA NHAU!";
                desc.className = "text-slate-600 mb-8 font-black text-xl tracking-wide uppercase";
            }

            if (!state.isHost) {
                btn.innerText = "Chờ Host...";
                btn.disabled = true;
                btn.classList.add('opacity-50');
            } else {
                btn.innerText = "Về Phòng";
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                document.getElementById('modal-content').classList.remove('scale-95');
            }, 10);
        }

        window.handleModalOk = () => {
            if(state.isHost && db) {
                const btn = document.getElementById('btn-modal-ok');
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
                
                const ref = doc(db, 'artifacts', appId, 'public', 'data', 'dino_rooms', state.roomId);
                updateDoc(ref, { 
                    status: 'waiting',
                    hostScore: 0, hostDead: false,
                    peerScore: 0, peerDead: false
                }).then(() => {
                    document.getElementById('modal').classList.add('opacity-0');
                    setTimeout(() => {
                        document.getElementById('modal').classList.add('hidden');
                        btn.innerHTML = 'Chơi Lại';
                    }, 300);
                    state.status = 'waiting';
                    ui.showScreen('screen-lobby');
                });
            }
        };

    </script>
</body>
</html>
